[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow_stats"
version = "0.1.0"
description = "Analyze LibreHardwareMonitor CSV logs to evaluate PC airflow configurations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
]

[project.scripts]
airflow-stats = "airflow_stats.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["airflow_stats*"]
